[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "business-master"
version = "0.1.0"
description = "Autonomous economic control system for continuously testing and allocating business hypotheses."
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "structlog>=24.4",
  "typer>=0.15",
]

[project.optional-dependencies]
orchestration = ["hatchet-sdk"]
ai = ["pydantic-ai"]
observability = ["opentelemetry-api>=1.28", "opentelemetry-sdk>=1.28"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
bm = "business_master.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/business_master"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["business_master"]
