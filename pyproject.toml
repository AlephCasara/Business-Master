[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "business-master"
version = "0.1.0"
description = "Evidence-driven economic experimentation and allocation engine."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "structlog>=24.4",
  "typer>=0.15",
]

[project.urls]
Repository = "https://github.com/AlephCasara/Business-Master"
Issues = "https://github.com/AlephCasara/Business-Master/issues"

[project.scripts]
bm = "business_master.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/business_master"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["business_master"]
