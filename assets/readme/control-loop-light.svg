<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Business Master control loop</title>
  <desc id="desc">World observations become evidence, beliefs, hypotheses, experiments, allocation, actions, and new evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
  </defs>
  <rect width="1200" height="560" rx="26" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="60" y="70" fill="#0F172A" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800">The economic control loop</text>
  <text x="60" y="100" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">External evidence changes beliefs; beliefs change what the system does next.</text>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <g><rect x="80" y="205" width="150" height="74" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/><text x="155" y="237" fill="#0F172A">WORLD</text><text x="155" y="258" fill="#64748B" font-size="11" font-weight="500">markets · people</text></g>
    <g><rect x="285" y="125" width="150" height="74" rx="18" fill="#EFF6FF" stroke="#93C5FD"/><text x="360" y="157" fill="#1D4ED8">OBSERVE</text><text x="360" y="178" fill="#64748B" font-size="11" font-weight="500">signals</text></g>
    <g><rect x="500" y="105" width="160" height="82" rx="20" fill="#EEF2FF" stroke="#A5B4FC"/><text x="580" y="139" fill="#4338CA">EVIDENCE</text><text x="580" y="160" fill="#64748B" font-size="11" font-weight="500">external + economic</text></g>
    <g><rect x="725" y="125" width="150" height="74" rx="18" fill="#F5F3FF" stroke="#C4B5FD"/><text x="800" y="157" fill="#6D28D9">BELIEF</text><text x="800" y="178" fill="#64748B" font-size="11" font-weight="500">state update</text></g>
    <g><rect x="930" y="205" width="170" height="74" rx="18" fill="#FAF5FF" stroke="#D8B4FE"/><text x="1015" y="237" fill="#7E22CE">HYPOTHESIS</text><text x="1015" y="258" fill="#64748B" font-size="11" font-weight="500">falsifiable claim</text></g>
    <g><rect x="880" y="360" width="170" height="74" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/><text x="965" y="392" fill="#0F172A">EXPERIMENT</text><text x="965" y="413" fill="#64748B" font-size="11" font-weight="500">bounded intervention</text></g>
    <g><rect x="625" y="405" width="185" height="74" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/><text x="717" y="437" fill="#0F172A">ALLOCATE</text><text x="717" y="458" fill="#64748B" font-size="11" font-weight="500">cash · compute · attention</text></g>
    <g><rect x="390" y="405" width="170" height="74" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/><text x="475" y="437" fill="#0F172A">ACTION</text><text x="475" y="458" fill="#64748B" font-size="11" font-weight="500">engine execution</text></g>
    <g><rect x="145" y="360" width="180" height="74" rx="18" fill="#ECFDF5" stroke="#6EE7B7"/><text x="235" y="392" fill="#047857">MEASURE</text><text x="235" y="413" fill="#64748B" font-size="11" font-weight="500">real-world response</text></g>
  </g>
  <g fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M230 220C248 190 260 173 285 165"/><path d="M435 151C458 143 476 141 500 141"/><path d="M660 141C684 142 703 147 725 158"/><path d="M875 174C902 188 919 205 930 222"/><path d="M1010 279C1010 310 994 334 982 360"/><path d="M880 411C852 424 837 430 810 437"/><path d="M625 442H560"/><path d="M390 442C363 437 346 427 325 413"/><path d="M188 360C167 335 154 311 154 279"/>
  </g>
  <path d="M235 360C303 291 395 230 500 176" fill="none" stroke="url(#accent)" stroke-width="4" stroke-dasharray="8 9" marker-end="url(#arrow)"/>
  <text x="368" y="291" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">new evidence ↺</text>
  <rect x="390" y="235" width="420" height="105" rx="22" fill="#0F172A"/>
  <text x="600" y="270" text-anchor="middle" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="800">Evidence changes what the system believes</text>
  <text x="600" y="299" text-anchor="middle" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">and therefore what it chooses to do next.</text>
  <text x="600" y="322" text-anchor="middle" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">closed loop ≠ generation · closed loop ≠ publishing · closed loop = changed decision</text>
</svg>