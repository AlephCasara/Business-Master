  <text x="76" y="77" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.6">AUTONOMOUS ECONOMIC CONTROL SYSTEM</text>
  <text x="58" y="155" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="800" letter-spacing="-2">Business Master</text>
  <text x="58" y="202" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">Turn uncertainty into experiments.</text>
  <text x="58" y="234" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">Turn experiments into evidence.</text>
  <text x="58" y="266" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">Turn evidence into better allocation.</text>
  <g transform="translate(58 315)"><circle cx="7" cy="7" r="7" fill="#34D399"/><text x="24" y="12" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">observe → believe → experiment → allocate → learn ↺</text></g>
  <g transform="translate(775 52)">
