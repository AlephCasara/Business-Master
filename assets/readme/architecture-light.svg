<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" role="img" aria-labelledby="title desc">
  <title id="title">Business Master architecture</title>
  <desc id="desc">An economic control plane governs seven shared capability factories: Intelligence, Creative, Product, Production, Distribution, Monetization and Telemetry. External outcomes return as evidence and ledger state.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker><linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EFF6FF"/><stop offset="0.5" stop-color="#EEF2FF"/><stop offset="1" stop-color="#FAF5FF"/></linearGradient></defs>
  <rect width="1240" height="720" rx="28" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="54" y="62" fill="#0F172A" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800">Economic control plane over shared capabilities</text>
  <text x="54" y="91" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Domain authority stays above replaceable cognition, production, distribution and commerce execution.</text>
  <rect x="54" y="126" width="1132" height="82" rx="20" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="620" y="158" text-anchor="middle" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="800" letter-spacing="1.4">EXTERNAL WORLD</text>
  <text x="620" y="184" text-anchor="middle" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">markets · audiences · distribution surfaces · commerce venues · customers</text>
  <rect x="54" y="245" width="1132" height="285" rx="26" fill="url(#band)" stroke="#C7D2FE"/>
  <text x="82" y="278" fill="#4338CA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="800" letter-spacing="1.4">BUSINESS MASTER ECONOMIC CONTROL PLANE</text>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <g><rect x="88" y="315" width="170" height="78" rx="18" fill="#FFFFFF" stroke="#BFDBFE"/><text x="173" y="347" fill="#0F172A" font-size="15" font-weight="800">World Model</text><text x="173" y="369" fill="#64748B" font-size="11">facts · observations</text></g>
    <g><rect x="292" y="315" width="160" height="78" rx="18" fill="#FFFFFF" stroke="#C7D2FE"/><text x="372" y="347" fill="#0F172A" font-size="15" font-weight="800">Beliefs</text><text x="372" y="369" fill="#64748B" font-size="11">confidence · freshness</text></g>
    <g><rect x="486" y="315" width="170" height="78" rx="18" fill="#FFFFFF" stroke="#C4B5FD"/><text x="571" y="347" fill="#0F172A" font-size="15" font-weight="800">Hypotheses</text><text x="571" y="369" fill="#64748B" font-size="11">falsifiable claims</text></g>
    <g><rect x="690" y="315" width="170" height="78" rx="18" fill="#FFFFFF" stroke="#D8B4FE"/><text x="775" y="347" fill="#0F172A" font-size="15" font-weight="800">Experiments</text><text x="775" y="369" fill="#64748B" font-size="11">bounded contracts</text></g>
    <g><rect x="894" y="315" width="240" height="78" rx="18" fill="#0F172A"/><text x="1014" y="347" fill="#F8FAFC" font-size="15" font-weight="800">Portfolio Control</text><text x="1014" y="369" fill="#CBD5E1" font-size="11">expected value · risk</text></g>
    <g><rect x="245" y="431" width="230" height="68" rx="17" fill="#FFFFFF" stroke="#CBD5E1"/><text x="360" y="460" fill="#0F172A" font-size="14" font-weight="800">Evidence &amp; Ledger</text><text x="360" y="480" fill="#64748B" font-size="11">external + economic truth</text></g>
    <g><rect x="510" y="431" width="220" height="68" rx="17" fill="#FFFFFF" stroke="#CBD5E1"/><text x="620" y="460" fill="#0F172A" font-size="14" font-weight="800">Risk / Capital</text><text x="620" y="480" fill="#64748B" font-size="11">gates · blast radius · spend</text></g>
    <g><rect x="765" y="431" width="230" height="68" rx="17" fill="#FFFFFF" stroke="#CBD5E1"/><text x="880" y="460" fill="#0F172A" font-size="14" font-weight="800">Resource Control</text><text x="880" y="480" fill="#64748B" font-size="11">cash · compute · human time</text></g>
  </g>
