  <path d="M1088 652V680C1088 696 1068 704 1038 704H90C72 704 60 692 60 672V208" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="77" y="552" transform="rotate(-90 77 552)" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">real actions + telemetry → evidence ↺</text>
