    <rect x="862" y="614" width="140" height="38" rx="12" fill="#FCE7F3"/><text x="932" y="638" fill="#9D174D">Monetization</text>
    <rect x="1018" y="614" width="140" height="38" rx="12" fill="#FDF2F8"/><text x="1088" y="638" fill="#9D174D">Telemetry</text>
