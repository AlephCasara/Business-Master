<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" role="img" aria-labelledby="title desc">
  <title id="title">Business Master architecture</title>
  <desc id="desc">External reality feeds the economic control plane; portfolio authority composes reusable Intelligence, Creative, Product, Production, Distribution, Monetization and Telemetry factories; telemetry returns evidence to the same control plane.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94A3B8"/></marker>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0F1B33"/><stop offset="0.5" stop-color="#171B3A"/><stop offset="1" stop-color="#251538"/></linearGradient>
  </defs>
  <rect width="1240" height="720" rx="28" fill="#0B1120" stroke="#26324A"/>
  <text x="54" y="62" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800">Economic control plane over reusable capability factories</text>
  <text x="54" y="91" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Economic authority stays above cognition and execution; external telemetry returns to the same World Model.</text>

  <rect x="54" y="126" width="1132" height="82" rx="20" fill="#111827" stroke="#334155"/>
  <text x="620" y="158" text-anchor="middle" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="800" letter-spacing="1.4">EXTERNAL REALITY</text>
  <text x="620" y="184" text-anchor="middle" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">markets · audiences · platforms · customers · products · payments · constraints</text>

  <rect x="54" y="245" width="1132" height="285" rx="26" fill="url(#band)" stroke="#3730A3"/>
  <text x="82" y="278" fill="#C7D2FE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="800" letter-spacing="1.4">BUSINESS MASTER — ECONOMIC CONTROL PLANE</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <g><rect x="88" y="315" width="170" height="78" rx="18" fill="#101827" stroke="#3B82F6"/><text x="173" y="347" fill="#F8FAFC" font-size="15" font-weight="800">World Model</text><text x="173" y="369" fill="#94A3B8" font-size="11">facts · observations</text></g>
    <g><rect x="292" y="315" width="160" height="78" rx="18" fill="#13182D" stroke="#6366F1"/><text x="372" y="347" fill="#F8FAFC" font-size="15" font-weight="800">Beliefs</text><text x="372" y="369" fill="#94A3B8" font-size="11">confidence · freshness</text></g>
    <g><rect x="486" y="315" width="170" height="78" rx="18" fill="#19172F" stroke="#8B5CF6"/><text x="571" y="347" fill="#F8FAFC" font-size="15" font-weight="800">Hypotheses</text><text x="571" y="369" fill="#94A3B8" font-size="11">falsifiable claims</text></g>
    <g><rect x="690" y="315" width="170" height="78" rx="18" fill="#21172F" stroke="#A855F7"/><text x="775" y="347" fill="#F8FAFC" font-size="15" font-weight="800">Experiments</text><text x="775" y="369" fill="#94A3B8" font-size="11">bounded contracts</text></g>
    <g><rect x="894" y="315" width="240" height="78" rx="18" fill="#E2E8F0"/><text x="1014" y="347" fill="#0F172A" font-size="15" font-weight="800">Portfolio Control</text><text x="1014" y="369" fill="#475569" font-size="11">value · uncertainty · risk</text></g>

    <g><rect x="245" y="431" width="230" height="68" rx="17" fill="#111827" stroke="#334155"/><text x="360" y="460" fill="#F8FAFC" font-size="14" font-weight="800">Evidence &amp; Metrics</text><text x="360" y="480" fill="#94A3B8" font-size="11">market + economic outcomes</text></g>
    <g><rect x="510" y="431" width="220" height="68" rx="17" fill="#111827" stroke="#334155"/><text x="620" y="460" fill="#F8FAFC" font-size="14" font-weight="800">Risk / Capital</text><text x="620" y="480" fill="#94A3B8" font-size="11">gates · blast radius · spend</text></g>
    <g><rect x="765" y="431" width="230" height="68" rx="17" fill="#111827" stroke="#334155"/><text x="880" y="460" fill="#F8FAFC" font-size="14" font-weight="800">Resource Control</text><text x="880" y="480" fill="#94A3B8" font-size="11">cash · compute · human time</text></g>
  </g>

  <g fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)">
    <path d="M258 354H292"/><path d="M452 354H486"/><path d="M656 354H690"/><path d="M860 354H894"/>
    <path d="M1014 393V414C1014 432 996 447 995 447"/><path d="M765 465H730"/><path d="M510 465H475"/><path d="M245 465H173C147 465 135 444 135 417V393"/>
  </g>
  <path d="M620 208V245" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="642" y="232" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">sensors</text>

  <rect x="54" y="567" width="1132" height="105" rx="22" fill="#111827" stroke="#334155"/>
  <text x="82" y="596" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="800" letter-spacing="1.3">SHARED CAPABILITY FACTORIES</text>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">
    <rect x="76" y="614" width="140" height="38" rx="12" fill="#0F1B33" stroke="#3B82F6"/><text x="146" y="639" fill="#93C5FD">Intelligence</text>
    <rect x="234" y="614" width="140" height="38" rx="12" fill="#141A38" stroke="#6366F1"/><text x="304" y="639" fill="#C7D2FE">Creative</text>
    <rect x="392" y="614" width="140" height="38" rx="12" fill="#191937" stroke="#7C3AED"/><text x="462" y="639" fill="#DDD6FE">Product</text>
    <rect x="550" y="614" width="140" height="38" rx="12" fill="#201735" stroke="#8B5CF6"/><text x="620" y="639" fill="#DDD6FE">Production</text>
    <rect x="708" y="614" width="140" height="38" rx="12" fill="#251638" stroke="#A855F7"/><text x="778" y="639" fill="#E9D5FF">Distribution</text>
    <rect x="866" y="614" width="140" height="38" rx="12" fill="#2A1732" stroke="#C084FC"/><text x="936" y="639" fill="#F3E8FF">Monetization</text>
    <rect x="1024" y="614" width="140" height="38" rx="12" fill="#1E293B" stroke="#94A3B8"/><text x="1094" y="639" fill="#E2E8F0">Telemetry</text>
  </g>

  <path d="M1014 499V545C1014 557 1002 567 980 567" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M1094 652V694H90C72 694 60 682 60 662V208" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="77" y="548" transform="rotate(-90 77 548)" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">external outcomes → telemetry → evidence ↺</text>
</svg>