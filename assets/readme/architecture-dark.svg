  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle"><rect x="110" y="614" width="210" height="38" rx="12" fill="#0F1B33" stroke="#3B82F6"/><text x="215" y="639" fill="#93C5FD">Content</text><rect x="365" y="614" width="210" height="38" rx="12" fill="#171B3A" stroke="#6366F1"/><text x="470" y="639" fill="#C7D2FE">Commerce</text><rect x="620" y="614" width="210" height="38" rx="12" fill="#21183A" stroke="#8B5CF6"/><text x="725" y="639" fill="#DDD6FE">B2B</text><rect x="875" y="614" width="210" height="38" rx="12" fill="#251538" stroke="#A855F7"/><text x="980" y="639" fill="#E9D5FF">Assets</text></g>
