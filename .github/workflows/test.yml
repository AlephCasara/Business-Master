name: test

on:
  push:
    branches: [main, "bootstrap/**", "expansion/**", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      BM_TEST_DATABASE_URL: postgresql://postgres:business-master@127.0.0.1:5432/business_master_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: business-master
          POSTGRES_DB: business_master_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d business_master_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src/business_master
      - name: Pytest
        run: pytest
