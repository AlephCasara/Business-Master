name: test

on:
  push:
    branches: [main, "bootstrap/**", "expansion/**", "feature/**", "feat/**", "refactor/**"]
  pull_request:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known
          python-version: "3.12"
      - name: Verify uv lockfile
        run: uv lock --check

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      BM_TEST_DATABASE_URL: postgresql://postgres:business-master@127.0.0.1:5432/business_master_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: business-master
          POSTGRES_DB: business_master_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d business_master_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync project
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check src tests examples
      - name: Mypy
        run: uv run mypy src/business_master
      - name: Pytest
        run: uv run pytest
      - name: Golden example
        run: uv run python examples/pricing_optimization.py

  ax-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known
          python-version: "3.12"
          enable-cache: true
      - name: Sync project with Ax
        run: uv sync --locked --extra ax
      - name: Ax adapter smoke test
        run: uv run pytest tests/test_ax_optimizer.py
